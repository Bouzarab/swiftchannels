<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swift Channels — share card</title>
<!--
  Source for assets/og-card.jpg — the 1200×630 image that shows when the site
  is shared on WhatsApp, Facebook, X or iMessage.

  Edit the prices here, then regenerate:   node build-og.js
  Fonts are pulled from node_modules (npm install @fontsource/sora @fontsource/inter).
-->
<style>
@font-face{font-family:Sora;font-weight:600;
  src:url('../node_modules/@fontsource/sora/files/sora-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:Sora;font-weight:800;
  src:url('../node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2') format('woff2')}
@font-face{font-family:InterC;font-weight:400;
  src:url('../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:InterC;font-weight:600;
  src:url('../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2') format('woff2')}

:root{
  --night:#050A18; --blue:#2F6BFF; --blue-hi:#5A8CFF; --blue-deep:#1B49C4;
  --cyan:#49D9FF; --ice:#E9EFFC; --muted:#93A6CC; --line:#1B2C54;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  position:relative;background:var(--night);
  font-family:InterC,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
/* ambient blue field, brightest at the top-left */
.glow{position:absolute;inset:0;
  background:
    radial-gradient(120% 130% at 0% 0%, rgba(47,107,255,.42), transparent 62%),
    radial-gradient(70% 90% at 92% 18%, rgba(73,217,255,.10), transparent 70%)}
/* faint grid, faded out towards the bottom right */
.grid{position:absolute;inset:0;
  background-image:
    linear-gradient(rgba(47,107,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(47,107,255,.06) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 95% 90% at 0% 0%, #000, transparent 75%)}
/* accent rule along the very top */
.rule{position:absolute;top:0;left:0;right:0;height:5px;
  background:linear-gradient(90deg, var(--cyan), rgba(73,217,255,0) 68%)}

.brand{position:absolute;left:86px;top:74px;display:flex;align-items:center;gap:24px}
.mark{width:60px;height:60px;border-radius:19px;position:relative;
  background:linear-gradient(135deg, var(--blue), var(--cyan));display:grid;place-items:center}
.mark::after{content:'';width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 0 22px rgba(255,255,255,.9)}
.brand span{font-family:Sora;font-weight:800;font-size:36px;letter-spacing:-.02em;color:#fff}

h1{position:absolute;left:88px;top:219px;width:1000px;
  font-family:Sora;font-weight:800;font-size:69px;line-height:1.10;
  letter-spacing:-.018em;color:var(--ice)}
h1 b{font-weight:800;background:linear-gradient(103deg, var(--cyan), var(--cyan) 40%, #BFEEFF);
  -webkit-background-clip:text;background-clip:text;color:transparent}

.sub{position:absolute;left:88px;top:400px;font-size:32px;color:var(--muted);letter-spacing:-.01em}

.chips{position:absolute;left:86px;top:486px;display:flex;gap:15px;align-items:stretch}
.chip{min-width:118px;height:89px;padding:14px 31px;border-radius:16px;
  border:1px solid var(--line);background:rgba(13,22,47,.72);
  display:flex;flex-direction:column;justify-content:center;gap:6px}
.chip .k{font-size:19px;color:var(--muted);line-height:1}
.chip .v{font-family:Sora;font-weight:600;font-size:34px;color:var(--ice);line-height:1;letter-spacing:-.01em}
.chip.hi{border-color:var(--blue);background:rgba(47,107,255,.20);
  box-shadow:0 0 0 1px rgba(47,107,255,.45), 0 10px 34px -12px rgba(47,107,255,.75)}
.chip.hi .v{color:var(--cyan)}

.domain{position:absolute;right:88px;top:531px;
  font-size:31px;color:var(--blue-hi);letter-spacing:-.01em}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="rule"></div>

  <div class="brand"><div class="mark"></div><span>Swift Channels</span></div>

  <h1>Every channel you watch,<br>on <b>one line</b>.</h1>

  <p class="sub">Live sports, films and series in 4K — delivered in minutes.</p>

  <div class="chips">
    <div class="chip"><div class="k">Monthly</div><div class="v">15 €</div></div>
    <div class="chip hi"><div class="k">Yearly</div><div class="v">57 €</div></div>
    <div class="chip"><div class="k">Try it</div><div class="v">Free 24h</div></div>
  </div>

  <div class="domain">swiftchannels.com</div>
</body>
</html>
